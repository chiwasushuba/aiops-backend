spring.application.name=aiops-backend

# Values are supplied by Docker Compose in a container and may be overridden
# when running the application directly from the host.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aiops}
spring.datasource.username=${DB_USERNAME:aiops}
spring.datasource.password=${DB_PASSWORD:}

# Production schema changes should be supplied through versioned migrations.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
